databaseChangeLog:
  - changeSet:
      id: 011-external-data-sources
      author: analytics-advisor
      changes:
        - createTable:
            tableName: external_data_source
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_external_data_source_name
              - column:
                  name: database_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: jdbc_url
                  type: varchar(1024)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: varchar(256)
                  constraints:
                    nullable: false
              - column:
                  name: encrypted_password
                  type: varchar(4096)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: last_tested_at
                  type: timestamp with time zone
              - column:
                  name: last_test_status
                  type: varchar(16)
              - column:
                  name: last_test_message
                  type: varchar(1024)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: external_data_source
            indexName: ix_external_data_source_type
            columns:
              - column:
                  name: database_type
