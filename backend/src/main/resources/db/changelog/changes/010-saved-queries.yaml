databaseChangeLog:
  - changeSet:
      id: 010-saved-query
      author: srse
      changes:
        - createTable:
            tableName: saved_query
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_saved_query_owner
                    references: app_user(id)
              - column:
                  name: name
                  type: varchar(256)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1024)
              - column:
                  name: payload_text
                  type: clob
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: saved_query
            indexName: ix_saved_query_owner
            columns:
              - column:
                  name: owner_user_id

  - changeSet:
      id: 010-saved-query-grant
      author: srse
      changes:
        - createTable:
            tableName: saved_query_grant
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: saved_query_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_saved_query_grant_query
                    references: saved_query(id)
              - column:
                  name: grantee_user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_saved_query_grant_user
                    references: app_user(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: saved_query_grant
            columnNames: saved_query_id, grantee_user_id
            constraintName: uq_saved_query_grant
