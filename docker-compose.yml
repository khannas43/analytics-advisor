# Analytics Advisor local development stack.
# One command:  docker compose up   ->  frontend at http://localhost:3000
#
# Brings up: two app containers (frontend, backend) + the local lakehouse
# stand-in (Presto + Hive metastore + MinIO) + PostgreSQL operational store
# (default) + a one-shot synthetic-data seed job.
#
# Optional DB2 operational store (parity / upgrade testing):
#   docker compose --profile db2 up
#
# DATA_MODE=synthetic here. In the client Dev environment use the 'live'
# profile / overrides so the backend points at on-prem Presto + DB2/PostgreSQL
# and the presto/metastore/minio/seed services are NOT started.

services:

  # ---------- App: frontend (Next.js 16 / React 19) ----------
  srse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-mock}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      - NEXT_PUBLIC_AUTH_MODE=${NEXT_PUBLIC_AUTH_MODE:-mock}
    depends_on:
      - srse-backend
    restart: unless-stopped

  # ---------- App: backend (Java 17 / Spring Boot 3.x fat-JAR) ----------
  srse-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DATA_MODE=synthetic
      # Operational plane (PostgreSQL / JPA — Liquibase at boot)
      - SRSE_OPERATIONAL_JDBC_URL=jdbc:postgresql://postgres:5432/srse
      - SRSE_OPERATIONAL_USER=srse
      - SRSE_OPERATIONAL_PASSWORD=${SRSE_OPERATIONAL_PASSWORD:-srse_local_pw}
      - SRSE_OPERATIONAL_DRIVER=org.postgresql.Driver
      # Encrypts passwords saved through Admin → Data Sources. The deploy script
      # generates this into the git-ignored .env file when absent.
      - SRSE_EXTERNAL_SOURCE_SECRET_KEY=${SRSE_EXTERNAL_SOURCE_SECRET_KEY:-}
      # Analytical plane (PrestoDB / JDBC)
      - SRSE_PRESTO_URL=jdbc:presto://presto:8080/iceberg/srse
      - SRSE_PRESTO_USER=srse
      - SRSE_PRESTO_PASSWORD=${SRSE_PRESTO_PASSWORD:-}
      - SRSE_PRESTO_SSL=${SRSE_PRESTO_SSL:-false}
      - SRSE_PRESTO_TRUSTSTORE_PATH=${SRSE_PRESTO_TRUSTSTORE_PATH:-}
      - SRSE_PRESTO_TRUSTSTORE_PASSWORD=${SRSE_PRESTO_TRUSTSTORE_PASSWORD:-}
      # Auth
      - SRSE_AUTH_MODE=${SRSE_AUTH_MODE:-mock}
      - SRSE_FRONTEND_ORIGINS=${SRSE_FRONTEND_ORIGINS:-http://localhost:3000}
      # Guardrails
      - SRSE_COHORT_CAP=1000
      - SRSE_QUERY_TIMEOUT_SECONDS=180
      - SRSE_ANALYSIS_ROW_CAP=1000
      - SRSE_AGE_BAND_COLUMN=${SRSE_AGE_BAND_COLUMN:-age_band}
      - SRSE_CONNECTION_OVERRIDE_PATH=/app/config/connection-overrides.properties
      # Required on first boot when app_user is empty (7.1b). Change after login.
      - SRSE_BOOTSTRAP_SUPER_ADMIN_USERNAME=${SRSE_BOOTSTRAP_SUPER_ADMIN_USERNAME:-superadmin}
      - SRSE_BOOTSTRAP_SUPER_ADMIN_PASSWORD=${SRSE_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
    volumes:
      - connection-overrides:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      presto:
        condition: service_started
    restart: unless-stopped

  # ---------- Operational store: PostgreSQL (default) ----------
  postgres:
    image: postgres:16-alpine
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL install on 5432.
      - "5433:5432"
    environment:
      POSTGRES_DB: srse
      POSTGRES_USER: srse
      POSTGRES_PASSWORD: ${SRSE_OPERATIONAL_PASSWORD:-srse_local_pw}
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srse -d srse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ---------- Operational store: DB2 (optional — profile db2) ----------
  db2:
    profiles: ["db2"]
    image: icr.io/db2_community/db2:11.5.8.0
    platform: linux/amd64
    privileged: true
    ports:
      - "50000:50000"
    environment:
      - LICENSE=accept
      - DB2INST1_PASSWORD=srse_local_pw
      - DBNAME=SRSEDB
      - ARCHIVE_LOGS=false
    volumes:
      - db2data:/database

  # ---------- Lakehouse stand-in: MinIO (object storage) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - miniodata:/data

  # ---------- Lakehouse stand-in: Hive metastore (for Iceberg) ----------
  metastore:
    image: apache/hive:3.1.3
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/srse/metastore-entrypoint.sh"]
    volumes:
      - ./docker/hive/metastore-entrypoint.sh:/opt/srse/metastore-entrypoint.sh:ro
    ports:
      - "9083:9083"
    environment:
      - SERVICE_NAME=metastore
    depends_on:
      - minio

  # ---------- Lakehouse stand-in: PrestoDB 0.297 ----------
  presto:
    image: prestodb/presto:0.297
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./docker/presto/catalog:/opt/presto-server/etc/catalog:ro
      - ./docker/presto/jvm.config:/opt/presto-server/etc/jvm.config:ro
    depends_on:
      - metastore
      - minio

  # ---------- One-shot: generate synthetic data as Iceberg tables ----------
  seed:
    build:
      context: ./docker/seed
      dockerfile: Dockerfile
    environment:
      - PRESTO_URL=jdbc:presto://presto:8080/iceberg/srse
      - ROWS=200000
    depends_on:
      - presto
    restart: "no"

volumes:
  postgresdata:
  db2data:
  miniodata:
  connection-overrides:
