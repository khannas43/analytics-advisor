# Real-engine verification stack for PRODUCT_PLAN 10.A.4 — NOT part of the product.
# Throw-away PostgreSQL and DB2 "connected business databases", plus a minimal Presto
# whose only catalog is the PostgreSQL one (the federation route). Credentials here are
# local test values only.
#
#   docker compose -f docker/verify/docker-compose.yml up -d
#   SRSE_REAL_ENGINE_IT=true mvn -f backend/pom.xml test -Dtest=ExternalDirectRealEngineIT -Djacoco.skip=true
#   docker compose -f docker/verify/docker-compose.yml down -v
name: aa-verify
services:
  pgsrc:
    image: postgres:16-alpine
    ports: ["5440:5432"]
    environment:
      POSTGRES_DB: srcdb
      POSTGRES_USER: aa
      POSTGRES_PASSWORD: aa_verify_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aa -d srcdb"]
      interval: 3s
      timeout: 3s
      retries: 30

  # amd64-only image: runs under emulation on Apple Silicon (slow first start, several minutes).
  db2src:
    image: icr.io/db2_community/db2:11.5.8.0
    platform: linux/amd64
    privileged: true
    ports: ["50001:50000"]
    environment:
      - LICENSE=accept
      - DB2INST1_PASSWORD=aa_verify_pw
      - DBNAME=SRCDB
      - ARCHIVE_LOGS=false

  presto:
    image: prestodb/presto:0.297
    ports: ["8082:8080"]
    volumes:
      - ./presto-catalog:/opt/presto-server/etc/catalog:ro
      - ../presto/jvm.config:/opt/presto-server/etc/jvm.config:ro
    depends_on:
      pgsrc:
        condition: service_healthy
