# Client Dev override — on-prem Presto + DB2; no local lakehouse/seed stack.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.client-dev.yml up srse-backend srse-frontend
#
# Supply CLIENT_* vars via .env or the environment (see .env.client-dev.example).
# Real hostnames/credentials are pending Lovadeep/Arvind (CLAUDE.md open items).
#
# db2 / presto / minio / metastore / seed remain defined in the base compose file
# but are deliberately NOT started — they run on-prem in this environment.

services:

  srse-backend:
    # !reset required: Compose merges depends_on lists; plain [] does not clear base deps.
    depends_on: !reset []
    environment:
      # NOT 'local': the 'local' profile's fast-fail Hikari timeout is a
      # laptop convenience only. Schema is owned by Liquibase (not Hibernate).
      - SPRING_PROFILES_ACTIVE=client-dev
      - DATA_MODE=live
      - SRSE_OPERATIONAL_JDBC_URL=${CLIENT_OPERATIONAL_JDBC_URL}
      - SRSE_OPERATIONAL_USER=${CLIENT_OPERATIONAL_USER}
      - SRSE_OPERATIONAL_PASSWORD=${CLIENT_OPERATIONAL_PASSWORD}
      - SRSE_OPERATIONAL_DRIVER=${CLIENT_OPERATIONAL_DRIVER:-com.ibm.db2.jcc.DB2Driver}
      - SRSE_PRESTO_URL=${CLIENT_PRESTO_URL}
      - SRSE_PRESTO_USER=${CLIENT_PRESTO_USER}
      - SRSE_PRESTO_PASSWORD=${CLIENT_PRESTO_PASSWORD:-}
      # A real on-prem watsonx.data endpoint typically requires SSL — set
      # CLIENT_PRESTO_SSL=true and the trust-store vars once Lovadeep confirms
      # the endpoint's cert setup (CLAUDE.md open item).
      - SRSE_PRESTO_SSL=${CLIENT_PRESTO_SSL:-true}
      - SRSE_PRESTO_TRUSTSTORE_PATH=${CLIENT_PRESTO_TRUSTSTORE_PATH:-}
      - SRSE_PRESTO_TRUSTSTORE_PASSWORD=${CLIENT_PRESTO_TRUSTSTORE_PASSWORD:-}
      - SRSE_AUTH_MODE=rajsewadwar
      - SRSE_COHORT_CAP=1000
      - SRSE_QUERY_TIMEOUT_SECONDS=30
      # The real Golden Layer's age-band column almost certainly isn't named
      # "age_band" — set CLIENT_AGE_BAND_COLUMN once Lovadeep confirms it.
      - SRSE_AGE_BAND_COLUMN=${CLIENT_AGE_BAND_COLUMN:-age_band}

  srse-frontend:
    environment:
      # Inherits build.args from the base compose file — set
      # NEXT_PUBLIC_API_BASE in .env (not here) and rebuild; this line just
      # has to stay consistent with the base file's substitution, not
      # re-hardcode localhost and silently override it back.
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      - NEXT_PUBLIC_AUTH_MODE=rajsewadwar
